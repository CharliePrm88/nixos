# ── Base ────────────────────────────────────────────────────────────────────
add_newline = false
# Prompt sinistro
format = """
$time\
$jobs\
$username$hostname\
$directory\
$git_branch$git_commit$git_state$git_status$git_metrics\
$localip$shlvl$singularity$kubernetes$vcsh$fossil_branch$fossil_metrics$hg_branch$hg_state$pijul_channel$docker_context$package$c$cmake$cobol$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$guix_shell$haskell$haxe$helm$java$julia$kotlin$gradle$lua$nim$nodejs$ocaml$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$zig$buf$nix_shell$conda$meson$spack$memory_usage$aws$gcloud$openstack$azure$nats$direnv$env_var$mise$crystal$os$container$netns$shell\
$battery$sudo\
$character"""

# Prompt destro
right_format = """
$cmd_duration$status"""

[hostname]
ssh_only = false
ssh_symbol = ' 🌐'
format = "[@$hostname$ssh_symbol]($style) "
style = ""
trim_at = ''

[character]
success_symbol = "[%](bright-green)"
error_symbol = "[%](red)"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[$duration]($style)"
style = "bold italic bright-white"

[directory]
read_only_style = "yellow"
truncate_to_repo = false
truncation_length = 0
style = ""

[line_break]
disabled = true

[status]
disabled = false
format = " [$status]($style)"
map_symbol = true
pipestatus = true
success_style = "bold green"
failure_style = "bold red"

[sudo]
format = '[$symbol]($style)'
disabled = false

[time]
disabled = false
time_format = "%H:%M:%S"
style = "bright-white"
format = "[$time]($style) "

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold bright-blue" 
style_root = "bold red"

#GIT
[git_branch]
format = "[$symbol$branch]($style)"
style = "purple"

[git_commit]
format = " [@$hash]($style)[$tag]($style)"
style = "yellow"
tag_disabled = false

[git_state]
format = "[($state $progress_current/$progress_total)]($style)"
style = "bright-white"

[git_metrics]
disabled = false

[git_status]
format = "([ $all_status$ahead_behind ]($style))"
style = "cyan"
conflicted = "⚠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
stashed = "📦${count}"
modified = "✎${count}"
staged = "✓${count}"
renamed = "»${count}"
deleted = "✖${count}"
untracked = "…${count}"

#Linguaggi che mi interessano
[package]
disabled = true

[java]
format = "[$symbol$version]($style) "
style = "bold yellow"

[nodejs]
format = "[$symbol$version]($style) "
style = "bold green"

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[kotlin]
format = '[$symbol($version )]($style)'

[rust]
format = '[$symbol($version )]($style)'


#CLOUD
[container]
style = "bright-yellow"

[docker_context]
format = '[$symbol$context]($style) '

[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'

[azure]
format = '[$symbol($subscription)]($style) '
disabled = false

[gcloud]
format = '[$symbol$account(@$domain)(\($region\))]($style) '

[kubernetes]
format = " [$symbol $context(::$namespace)]($style)"
disabled = false

#ALTRO (non completa - mi ero rotto le palle)

[buf]
format = '[$symbol($version )]($style)'

[bun]
format = '[$symbol($version )]($style)'

[c]
format = '[$symbol($version(-$name) )]($style)'

[cpp]
format = '[$symbol($version(-$name) )]($style)'

[cmake]
format = '[$symbol($version )]($style)'

[cobol]
format = '[$symbol($version )]($style)'

[conda]
format = '[$symbol$environment]($style) '

[crystal]
format = '[$symbol($version )]($style)'

[daml]
format = '[$symbol($version )]($style)'

[dart]
format = '[$symbol($version )]($style)'

[deno]
format = '[$symbol($version )]($style)'

[dotnet]
format = '[$symbol($version )(🎯 $tfm )]($style)'

[elixir]
format = '[$symbol($version \(OTP $otp_version\) )]($style)'

[elm]
format = '[$symbol($version )]($style)'

[erlang]
format = '[$symbol($version )]($style)'

[fennel]
format = '[$symbol($version )]($style)'

[fortran]
format = '[$symbol($version )]($style)'

[gleam]
format = '[$symbol($version )]($style)'

[golang]
format = '[$symbol($version )]($style)'

[guix_shell]
format = '[$symbol]($style) '

[gradle]
format = '[$symbol($version )]($style)'

[haskell]
format = '[$symbol($version )]($style)'

[haxe]
format = '[$symbol($version )]($style)'

